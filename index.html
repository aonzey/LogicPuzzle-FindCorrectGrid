<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>逻辑推理：找出正确格子</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="controls-card">
        <div style="display: flex; gap: 10px;">
            <label>地图尺寸:</label>
            <input type="number" id="size-in" style="width:45px" value="5" min="4" max="15">
            <input type="checkbox" id="unique-chk"> <label>唯一解</label>
            <input type="checkbox" id="auto-mark-chk"> <label>自动打标记</label>
        </div>
        <div style="display: flex; gap: 10px;">
	        <button onclick="preInit()">重开</button>
	        <button id="pause-btn" onclick="togglePause()">⏸️</button>
	        <button id="pony-btn" class="btn-pony" onclick="givePonyHint()">翻一个(🌹)</button>
	        <button id="mark-btn" onclick="giveMarkHint()">标记提示(✕)</button>
        </div>
    </div>

    <div class="status-area">
        <div id="lives-ui" class="lives">❤️❤️❤️</div>
        <div id="timer-ui" class="timer">01:00</div>
        <div id="rem-ui" style="color:#6c5ce7">剩余: 0</div>
    </div>

    <div id="grid"></div>
    <div class="footer-hint">单击标记 ✕ | 双击确认 🌹</div>
    <div class="op-tip">注意:唯一解勾选时,地图尺寸10以上容易导致生成卡顿</div>
    <div class="op-tip">规则: 每种颜色块中仅有一个正确, 每行每列有且仅有一个正确, 正确的格子互不相邻.</div>

    <script src="js/game.js"></script>
</body>
</html>
